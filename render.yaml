services:
  - type: web
    name: career-radar
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 4321
      - key: JOB_SCRAPER_DATA_DIR
        value: /tmp/career-radar-cache
      - key: AUTH_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
